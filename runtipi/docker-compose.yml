services:
  wizard-monarch:
    # runtime.package: source. The App Manager mounts this repo at the pinned commit on /app.
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    working_dir: /app
    command: [python, /app/app/server.py]
    pids_limit: 64
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    tmpfs:
    - /tmp
    environment:
      PORT: '8806'
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
      DATA_DIR: /data/private
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
    - ${APP_SOURCE_DIR}:/app:ro
    - ${APP_DATA_DIR}/data:/data
    read_only: true
    x-runtipi:
      is_main: true
      internal_port: 8806
x-runtipi:
  schema_version: 2
  overrides: []
